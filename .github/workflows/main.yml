name: Main

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        env: [esp32, matrixportal]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache
        uses: actions/cache@v4
        with:
          key: cache-${{ matrix.env }}-${{ github.ref_name }}
          path: |
            ~/.cache/pip
            ~/.platformio/.cache

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup PlatformIO
        run: pip install --upgrade platformio

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install C++ dependencies
        run: pio pkg install --environment ${{ matrix.env }}

      - name: Build firmware
        run: pio run --environment ${{ matrix.env }}

      - name: Build filesystem
        run: pio run --target buildfs --environment ${{ matrix.env }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4

      - name: Rename artifacts for release
        run: |
          mv build-esp32/firmware.bin build-esp32/esp32-firmware.bin
          mv build-esp32/littlefs.bin build-esp32/esp32-littlefs.bin
          mv build-matrixportal/firmware.bin build-matrixportal/matrixportal-firmware.bin
          mv build-matrixportal/littlefs.bin build-matrixportal/matrixportal-littlefs.bin

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          generate_release_notes: true
          files: |
            build-esp32/esp32-firmware.bin
            build-esp32/esp32-littlefs.bin
            build-matrixportal/matrixportal-firmware.bin
            build-matrixportal/matrixportal-littlefs.bin
